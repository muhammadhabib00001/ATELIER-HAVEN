name: Automated Article Publishing & Google Drive Backup

on:
  # Runs 4 times daily (00:00, 06:00, 12:00, 18:00 UTC = 4 articles/day evenly spaced for optimal SEO indexing)
  schedule:
    - cron: '0 0,6,12,18 * * *'
  # Allows manual triggering with optional custom keyword and count (1-5 articles)
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to generate (1 to 5, recommended: 3-4 for batch)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      topic:
        description: 'Article Topic / Keyword (Leave blank to fetch from Google Drive file)'
        required: false
        type: string
      category:
        description: 'Category (Select a specific category or leave auto-balanced)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - kitchen
          - bathroom
          - living-room
          - bedroom
          - home-decor
          - furniture
          - lighting
          - renovation
          - diy
          - garden-outdoor
          - small-spaces
          - design-trends

permissions:
  contents: write

jobs:
  publish-and-backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate SEO Article & Sync Links
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.VERTEX_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.VERTEX_LOCATION || 'us-central1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          node scripts/run-pipeline.js "${{ github.event.inputs.topic }}" "${{ github.event.inputs.category }}" "$COUNT"

      - name: Verify Build
        run: npm run build

      - name: Commit and Push New Article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/articles.json public/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-publish new article & update Google Drive backup [skip ci]"
            
            # Robust push with pull rebase retries to permanently prevent push conflicts:
            pushed=false
            for i in {1..5}; do
              echo "Pulling latest remote changes with rebase (attempt $i)..."
              git pull --rebase origin main || true
              echo "Pushing changes to origin main (attempt $i)..."
              if git push origin main; then
                pushed=true
                echo "Successfully pushed article to origin main!"
                break
              fi
              echo "Push failed, waiting 3 seconds before retry..."
              sleep 3
            done

            if [ "$pushed" = false ]; then
              echo "Failed to push after 5 attempts."
              exit 1
            fi
          fi
