<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Slate Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1B18" />
      <stop offset="100%" stop-color="#0E0C0B" />
    </linearGradient>

    <!-- Rich Roman Bronze-Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DC8C" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#A57A18" />
      <stop offset="100%" stop-color="#E8C564" />
    </linearGradient>

    <!-- Warm Ambient Light in the Atrium Court -->
    <radialGradient id="favGlow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#FBF2DB" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0E0C0B" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle drop shadow on the central architectural emblem -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Luxury Beveled Dark Stone Plinth / Favicon Base -->
  <rect x="5" y="5" width="118" height="118" rx="26" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2.2" />
  
  <!-- Subtle Internal Architectural Inset Border -->
  <rect x="11" y="11" width="106" height="106" rx="20" fill="none" stroke="#3A332C" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- Warm Atrium Light Glow -->
  <circle cx="64" cy="72" r="38" fill="url(#favGlow)" />

  <!-- Iconic 'A' Atrium Archway Monogram -->
  <g filter="url(#emblemShadow)">
    <!-- Roman Classical Arch -->
    <path d="M36,94 L36,54 C36,38 48,27 64,27 C80,27 92,38 92,54 L92,94" fill="none" stroke="url(#favGold)" stroke-width="4.2" stroke-linecap="round" />
    
    <!-- Bold Modern 'A' Triangular Apex -->
    <polygon points="64,18 92,94 80,94 64,52 48,94 36,94" fill="url(#favGold)" />
    
    <!-- Architectural Transom Tie Bar -->
    <line x1="42" y1="68" x2="86" y2="68" stroke="#1F1B18" stroke-width="3" />
    <line x1="44" y1="68" x2="84" y2="68" stroke="url(#favGold)" stroke-width="1.8" />

    <!-- Keystone & Crown Ornament -->
    <rect x="59.5" y="22" width="9" height="8" fill="url(#favGold)" rx="1.2" />
    <polygon points="64,13 69,18 59,18" fill="url(#favGold)" />

    <!-- Stepped Ground Stylobate / Base -->
    <rect x="25" y="94" width="78" height="5" fill="url(#favGold)" rx="1.5" />
  </g>
</svg>
