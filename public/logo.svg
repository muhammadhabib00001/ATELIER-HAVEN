<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BA4B" />
      <stop offset="35%" stop-color="#B8860B" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6212" />
    </linearGradient>
    <linearGradient id="logoDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2824" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
    <radialGradient id="logoGlow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#FAF4E8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#FAF4E8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FAF4E8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Architectural Emblem -->
  <g transform="translate(10, 16)">
    <polygon points="24,3 45,17 45,43 3,43 3,17" fill="url(#logoDark)" stroke="url(#logoGold)" stroke-width="1.8" />
    <path d="M13,43 L13,26 Q24,13 35,26 L35,43 Z" fill="url(#logoGlow)" />
    <path d="M13,43 L13,26 C13,19.5 18,14.5 24,14.5 C30,14.5 35,19.5 35,26 L35,43" fill="none" stroke="url(#logoGold)" stroke-width="2.2" />
    <polygon points="24,9.5 38.5,43 32.5,43 24,24.5 15.5,43 9.5,43" fill="url(#logoGold)" fill-opacity="0.3" stroke="url(#logoGold)" stroke-width="1.1" />
    <rect x="22" y="13" width="4" height="3.5" fill="url(#logoGold)" rx="0.5" />
    <rect x="1" y="43" width="46" height="3.5" fill="url(#logoGold)" rx="0.5" />
  </g>

  <!-- Brand Typography: ATRIUM LIVINGS -->
  <text x="74" y="45" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="29" font-weight="700" letter-spacing="0.22em" fill="#1C1917">ATRIUM</text>
  <text x="242" y="45" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="29" font-weight="500" letter-spacing="0.20em" fill="#9E6B28">LIVINGS</text>
  <text x="76" y="62" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.36em" fill="#8E887E">ARCHITECTURAL • INTERIOR • SANCTUARY</text>
</svg>
